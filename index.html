  <div class="app-shell">
    <main class="app-main" id="appMain">
      <section class="view" data-view="home" aria-label="首页"></section>
      <section class="view" data-view="reports" aria-label="统计" hidden></section>
      <section class="view" data-view="budget" aria-label="预算" hidden></section>
      <section class="view" data-view="settings" aria-label="我的" hidden></section>
    </main>

    <nav class="tabbar" aria-label="主导航">
      <a class="tab" href="#home" data-tab="home">
        <svg class="icon" aria-hidden="true"><use href="#i-home"/></svg>
        <span>首页</span>
      </a>
      <a class="tab" href="#reports" data-tab="reports">
        <svg class="icon" aria-hidden="true"><use href="#i-chart"/></svg>
        <span>统计</span>
      </a>
      <button class="tab tab-add" type="button" data-action="open-entry" aria-label="记一笔">
        <span class="tab-add-circle">
          <svg class="icon" aria-hidden="true"><use href="#i-plus"/></svg>
        </span>
      </button>
      <a class="tab" href="#budget" data-tab="budget">
        <svg class="icon" aria-hidden="true"><use href="#i-wallet"/></svg>
        <span>预算</span>
      </a>
      <a class="tab" href="#settings" data-tab="settings">
        <svg class="icon cat-tab-icon" aria-hidden="true"><use href="#i-cat-face"/></svg>
        <span>我的</span>
      </a>
    </nav>

  </div>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden>
    <svg class="icon toast-icon" aria-hidden="true"><use href="#i-check"/></svg>
    <span id="toastMessage"></span>
    <button class="toast-action" id="toastAction" type="button" hidden></button>
  </div>

  <dialog class="sheet-dialog" id="entryDialog" aria-labelledby="entryTitle">
    <div class="sheet">
      <div class="sheet-grabber" aria-hidden="true"></div>
      <div class="sheet-head">
        <div>
          <p class="sheet-kicker" id="entryKicker">新的记录</p>
          <h2 class="sheet-title" id="entryTitle">记一笔</h2>
        </div>
        <button class="icon-btn" type="button" data-close-dialog="entryDialog" aria-label="关闭">
          <svg class="icon" aria-hidden="true"><use href="#i-close"/></svg>
        </button>
      </div>

      <form id="entryForm" novalidate>
        <div class="type-switch" role="group" aria-label="收支类型">
          <button class="active" type="button" data-entry-type="expense">支出</button>
          <button type="button" data-entry-type="income">收入</button>
        </div>

        <div class="amount-block">
          <label class="sr-only" for="amountInput">金额</label>
          <span class="amount-symbol" aria-hidden="true">¥</span>
          <input class="amount-input" id="amountInput" type="text" inputmode="decimal" autocomplete="off" placeholder="0.00" maxlength="12" aria-describedby="entryError">
        </div>
        <p class="form-error" id="entryError" hidden></p>

        <div class="field-heading">
          <span>记账类型</span>
          <button class="field-add-btn" type="button" data-action="open-category-editor">＋ 自定义</button>
        </div>
        <div class="category-grid" id="categoryPicker" role="group" aria-label="记账类型"></div>

        <div class="entry-meta">
          <label class="field">
            <span class="field-label">日期</span>
            <span class="input-with-icon">
              <svg class="icon" aria-hidden="true"><use href="#i-calendar"/></svg>
              <input class="input" id="dateInput" type="date" required>
            </span>
          </label>
          <label class="field">
            <span class="field-label">备注 <em>选填</em></span>
            <input class="input" id="noteInput" type="text" maxlength="40" placeholder="写点什么…" autocomplete="off">
          </label>
        </div>

        <button class="btn btn-primary btn-save" id="entrySave" type="submit">保存记录</button>
        <button class="text-danger" id="deleteEntry" type="button" hidden>删除这笔记录</button>
      </form>
    </div>
  </dialog>

  <dialog class="sheet-dialog" id="budgetDialog" aria-labelledby="budgetTitle">
    <div class="sheet">
      <div class="sheet-grabber" aria-hidden="true"></div>
      <div class="sheet-head">
        <div>
          <p class="sheet-kicker">每月循环</p>
          <h2 class="sheet-title" id="budgetTitle">设置预算</h2>
        </div>
        <button class="icon-btn" type="button" data-close-dialog="budgetDialog" aria-label="关闭">
          <svg class="icon" aria-hidden="true"><use href="#i-close"/></svg>
        </button>
      </div>

      <form id="budgetForm" novalidate>
        <div class="budget-category-wrap" id="budgetCategoryWrap" hidden>
          <div class="field-heading"><span>选择分类</span></div>
          <div class="category-grid compact" id="budgetCategoryPicker" role="group" aria-label="预算分类"></div>
        </div>

        <label class="field">
          <span class="field-label">每月预算金额</span>
          <span class="money-input">
            <span aria-hidden="true">¥</span>
            <input id="budgetAmountInput" type="text" inputmode="decimal" autocomplete="off" placeholder="0.00" maxlength="12">
          </span>
        </label>
        <p class="form-error" id="budgetError" hidden></p>
        <p class="form-note" id="budgetNote">预算会按月循环，修改后对所有月份生效。</p>

        <button class="btn btn-primary" type="submit">保存预算</button>
        <button class="text-muted" id="clearBudget" type="button" hidden>清除这项预算</button>
      </form>
    </div>
  </dialog>

  <dialog class="sheet-dialog" id="categoryDialog" aria-labelledby="categoryTitle">
    <div class="sheet category-sheet">
      <div class="sheet-grabber" aria-hidden="true"></div>
      <div class="sheet-head">
        <div>
          <p class="sheet-kicker" id="categoryKicker">玉子账 · 自定义分类</p>
          <h2 class="sheet-title" id="categoryTitle">添加分类</h2>
        </div>
        <button class="icon-btn" type="button" data-close-dialog="categoryDialog" aria-label="关闭">
          <svg class="icon" aria-hidden="true"><use href="#i-close"/></svg>
        </button>
      </div>

      <form id="categoryForm" novalidate>
        <label class="field">
          <span class="field-label">分类名称 <em>最多 10 个字</em></span>
          <input class="input category-name-input" id="categoryNameInput" type="text" maxlength="10" placeholder="例如：咖啡、猫咪、旅行" autocomplete="off">
        </label>
        <div class="field-heading">
          <span>选个小图标</span>
          <span class="field-hint">会用时间轴里</span>
        </div>
        <div class="icon-picker" id="categoryIconPicker" role="group" aria-label="分类图标"></div>
        <p class="form-error" id="categoryError" hidden></p>
        <p class="form-note" id="categoryNote">自定义分类会出现在记账、统计和分类预算里。</p>
        <button class="btn btn-primary category-save" type="submit">保存分类</button>
        <button class="text-danger" id="deleteCategory" type="button" hidden>删除这个分类</button>
      </form>
    </div>
  </dialog>

  <dialog class="sheet-dialog" id="sortDialog" aria-labelledby="sortTitle">
    <div class="sheet sort-sheet">
      <div class="sheet-grabber" aria-hidden="true"></div>
      <div class="sheet-head">
        <div>
          <p class="sheet-kicker">玉子账 · 类型手账</p>
          <h2 class="sheet-title" id="sortTitle">调整类型顺序</h2>
        </div>
        <button class="icon-btn" type="button" data-close-dialog="sortDialog" aria-label="关闭">
          <svg class="icon" aria-hidden="true"><use href="#i-close"/></svg>
        </button>
      </div>
      <div class="sort-tabs" role="group" aria-label="排序类型">
        <button class="active" type="button" data-action="sort-tab" data-type="expense">支出类型</button>
        <button type="button" data-action="sort-tab" data-type="income">收入类型</button>
      </div>
      <p class="sort-hint">用上下箭头把常用的类型排到前面，记账时会按这个顺序显示。</p>
      <div class="sort-list" id="sortList"></div>
      <button class="text-muted" id="resetCategoryOrder" type="button">恢复默认顺序</button>
    </div>
  </dialog>

  <dialog class="sheet-dialog" id="cloudDialog" aria-labelledby="cloudTitle">
    <div class="sheet cloud-sheet">
      <div class="sheet-grabber" aria-hidden="true"></div>
      <div class="sheet-head">
        <div>
          <p class="sheet-kicker">YUZI CLOUD</p>
          <h2 class="sheet-title" id="cloudTitle">云同步</h2>
        </div>
        <button class="icon-btn" type="button" data-close-dialog="cloudDialog" aria-label="关闭">
          <svg class="icon" aria-hidden="true"><use href="#i-close"/></svg>
        </button>
      </div>

      <div class="cloud-account-panel" id="cloudAccountPanel" hidden>
        <div class="cloud-account-card">
          <span class="cloud-account-icon"><svg class="icon" aria-hidden="true"><use href="#i-cloud"/></svg></span>
          <div><strong id="cloudAccountEmail">—</strong><span id="cloudAccountStatus">已连接</span></div>
        </div>
        <button class="btn btn-primary" id="cloudSyncNow" type="button">立即同步</button>
        <button class="text-muted" id="cloudLogout" type="button">退出云账号</button>
      </div>

      <form id="cloudAuthForm" novalidate>
        <div class="cloud-tabs" role="group" aria-label="登录或注册">
          <button class="active" type="button" data-action="cloud-tab" data-mode="login">登录</button>
          <button type="button" data-action="cloud-tab" data-mode="register">注册</button>
        </div>
        <label class="field">
          <span class="field-label">同步服务器地址</span>
          <input class="input" id="cloudServerInput" type="url" inputmode="url" placeholder="https://your-api.example.com" autocomplete="url">
        </label>
        <label class="field">
          <span class="field-label">邮箱</span>
          <input class="input" id="cloudEmailInput" type="email" inputmode="email" placeholder="you@example.com" autocomplete="email">
        </label>
        <label class="field">
          <span class="field-label">密码</span>
          <input class="input" id="cloudPasswordInput" type="password" placeholder="至少 8 位" autocomplete="current-password">
        </label>
        <p class="form-error" id="cloudError" hidden></p>
        <button class="btn btn-primary cloud-submit" id="cloudSubmit" type="submit">登录并同步</button>
        <p class="form-note">云同步可选，开启后账目会传输到你自己的同步服务器；不登录时仍然只保存在本机。</p>
      </form>
    </div>
  </dialog>

  <dialog class="modal-dialog" id="confirmDialog" aria-labelledby="confirmTitle">
    <div class="modal-card">
      <div class="modal-icon danger" id="confirmIcon">
        <svg class="icon" aria-hidden="true"><use href="#i-alert"/></svg>
      </div>
      <h2 class="modal-title" id="confirmTitle">确认操作</h2>
      <p class="modal-text" id="confirmText"></p>
      <div class="modal-actions">
        <button class="btn btn-secondary" id="confirmCancel" type="button">取消</button>
        <button class="btn btn-danger" id="confirmOk" type="button">确认</button>
      </div>
    </div>
  </dialog>

  <dialog class="modal-dialog" id="importDialog" aria-labelledby="importTitle">
    <div class="modal-card">
      <div class="modal-icon">
        <svg class="icon" aria-hidden="true"><use href="#i-upload"/></svg>
      </div>
      <h2 class="modal-title" id="importTitle">恢复备份</h2>
      <p class="modal-text" id="importInfo"></p>
      <div class="import-summary" id="importSummary"></div>
      <div class="modal-actions vertical">
        <button class="btn btn-primary" id="importMerge" type="button">合并导入</button>
        <button class="btn btn-secondary" id="importReplace" type="button">覆盖当前数据</button>
        <button class="text-muted" id="importCancel" type="button">取消</button>
      </div>
    </div>
  </dialog>

  <input id="fileInput" type="file" accept=".json,.csv,application/json,text/csv" hidden>

  <noscript>
    <div class="noscript">玉子账需要启用 JavaScript 才能使用。</div>
  </noscript>

  <script src="core.js?v=1.4.0"></script>
  <script src="sync.js?v=1.4.0"></script>
  <script src="cloud-config.js?v=1.4.0"></script>
  <script src="app.js?v=1.4.0"></script>
</body>
</html>
